
set -g default-terminal "tmux-256color"
set -g default-command /bin/zsh
set -g default-shell /bin/zsh

unbind C-b
set -g prefix C-u

# Dvorak-friendly pane navigation: h/m/g/t = left/down/up/right
setw -g mode-keys vi
unbind-key j
unbind-key k
unbind-key l
bind-key h select-pane -L
bind-key m select-pane -D
bind-key g select-pane -U
bind-key t select-pane -R
bind-key n next-window

# New splits/windows inherit current path
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vi copy mode
bind Escape copy-mode
bind P paste-buffer
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "$NIXDIR/scripts/cb"
bind-key -T copy-mode-vi 'r' send-keys -X rectangle-toggle

# Dvorak copy-mode navigation (matches ideavimrc / neovim keymaps.lua)
bind-key -T copy-mode-vi u send-keys -X cursor-up
bind-key -T copy-mode-vi e send-keys -X cursor-down
bind-key -T copy-mode-vi = send-keys -X cursor-left
bind-key -T copy-mode-vi + send-keys -X cursor-right
bind-key -T copy-mode-vi h send-keys -X previous-word
bind-key -T copy-mode-vi t send-keys -X next-word-end
bind-key -T copy-mode-vi , send-keys -X back-to-indentation
bind-key -T copy-mode-vi g command-prompt -1 -p "(jump to forward)" { send-keys -X jump-to-forward -- "%%" }
bind-key -T copy-mode-vi G command-prompt -1 -p "(jump to backward)" { send-keys -X jump-to-backward -- "%%" }
bind-key -T copy-mode-vi [ send-keys -X scroll-up
bind-key -T copy-mode-vi ] send-keys -X scroll-down
bind-key -T copy-mode-vi ( send-keys -X page-up
bind-key -T copy-mode-vi ) send-keys -X page-down

# Smart Home — 1st press: first non-blank on line; 2nd press (cursor unmoved): start of line
set -g @home_x -1
bind-key -T copy-mode-vi Home {
    if-shell -F "#{==:#{copy_cursor_x},#{@home_x}}" {
        send-keys -X start-of-line
        set -g @home_x -1
    } {
        send-keys -X back-to-indentation
        set -Fg @home_x "#{copy_cursor_x}"
    }
}
bind-key -T copy-mode-vi End send-keys -X end-of-line

# Swap / and ? in copy-mode so / searches up (most-recent first), incremental find-as-you-type
bind-key -T copy-mode-vi / command-prompt -i -T search -p "(search up)" { send-keys -X search-backward-incremental -- "%%" }
bind-key -T copy-mode-vi ? command-prompt -i -T search -p "(search down)" { send-keys -X search-forward-incremental -- "%%" }

# prefix / → enter copy-mode and start incremental upward search
bind-key / copy-mode \; command-prompt -i -T search -p "(search up)" { send-keys -X search-backward-incremental -- "%%" }

# prefix v → enter copy-mode with visual selection already started
bind-key v copy-mode \; send-keys -X begin-selection

# Mouse
set-option -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

set -g update-environment -r
set-option -g status-interval 2

# Time messages remain in the status bar
set-option -g display-time 4000

bind-key r source-file ~/.tmux.conf \; display-message "Configuration reloaded"

# Pipe the current pane to a log file with Shift-H - Press Shift-H again to stop.
bind-key H pipe-pane -o "cat >>$HOME/#W-tmux.log" \; display-message "Toggled logging to $HOME/#W-tmux.log"

# Cycle panes
bind-key ` select-pane -t :.+

# Ctrl+Alt+Left/Right to switch windows
bind -n C-M-Left previous-window
bind -n C-M-Right next-window

# Show url in buffer on osx
bind C-o run-shell "open $(tmux show-buffer)"

# Maximize and restore panes. Don't switch windows between using these :)
unbind Up
bind Up neww -d -n tmp \; swap-pane -s tmp.1 \; select-window -t tmp
unbind Down
bind Down last-window \; swap-pane -s tmp.1 \; kill-window -t tmp

# prefix y — yank last command output to clipboard
bind-key y run-shell "$NIXDIR/tmux/yank-last-output.sh"

# OSX Clipboard support
bind C-v run "tmux set-buffer $(reattach-to-user-namespace pbpaste); tmux paste-buffer"
bind C-c run "tmux save-buffer - | cb"
