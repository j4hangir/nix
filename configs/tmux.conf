# $NIXDIR below is expanded while this file is *lexed*, from the environment the
# server already has — so it must be set before this file is sourced. ~/.tmux.conf
# does `set-environment -g NIXDIR <path>` first (setup.sh writes both lines).
# %hidden would do it inline but needs tmux >= 3.2; this way works on 3.0+.
# Fallback below only helps child shells, not this file's own expansion.
%if "#{==:$NIXDIR,}"
set-environment -g NIXDIR /nix
%endif

set-window-option -g mode-keys vi

# Terminal title — [mosh I:N] when in mosh, plain otherwise
set -g set-titles on
set -g set-titles-string '#{?@mosh,[mosh: #I:#{session_windows}] - ,}#{@user}@#H'

# detect mosh + set @user at server start / config reload
run-shell 'tmux set -g @user "$(whoami)"; [ -n "$NIX_MOSH" ] && tmux set -g @mosh 1 || true'

# Let the shell control window names (dir on idle, command on exec)
set -g allow-rename on
set -g automatic-rename on

# Scroll History
set -g history-limit 30000

set -g @plugin 'nhdaly/tmux-better-mouse-mode'

# ^B/ to search
bind-key / copy-mode\; command-prompt -p "search up:" "send -X search-backward '%%%'"


# Make mouse useful in copy mode
setw -g mouse on

# Set ability to capture on start and restore on exit window data when running an application
setw -g alternate-screen on

# Lower escape timing from 500ms to 50ms for quicker response to scroll-buffer access.
set -s escape-time 0

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

# switch panes using Alt-arrow without prefix.
# Left/Right are "smart": if a pane exists in that direction, switch to it;
# if already at the edge (#{pane_at_left}/#{pane_at_right} == 1), fall through
# and send M-b/M-f to the shell for backward-word/forward-word instead.
bind -n M-Left  if-shell -F '#{pane_at_left}'  'send-keys M-b' 'select-pane -L'
bind -n M-Right if-shell -F '#{pane_at_right}' 'send-keys M-f' 'select-pane -R'
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

set -g @scroll-speed-num-lines-per-scroll 5

######################
### DESIGN CHANGES ###
######################

# panes
set -g pane-border-style "fg=black"
set -g pane-active-border-style "fg=brightred"

## Status bar design
# status line
set -g status-justify left
set -g status-style "bg=default,fg=colour12"
set -g status-interval 2

# messaging
set -g message-style "fg=black,bg=yellow"
set -g message-command-style "fg=blue,bg=black"

#window mode
setw -g mode-style "bg=colour6,fg=colour0"

# window status
setw -g window-status-format "#[fg=magenta]#[bg=black] #I #[bg=cyan]#[fg=colour8] #W "
setw -g window-status-current-format "#[bg=brightmagenta]#[fg=colour8] #I #[fg=colour8]#[bg=colour14] #W "
setw -g window-status-current-style "bg=colour0,fg=colour11,dim"
setw -g window-status-style "bg=green,fg=black,reverse"

# Info on left (I don't have a session display for now)
set -g status-left ''

# loud or quiet?
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none

set -g default-terminal "tmux-256color"
set -g set-clipboard external
# terminal-features is tmux >= 3.2; older tmux advertises OSC 52 via the Ms cap.
# (#{>=:} is also 3.2+, so on older tmux it yields "" and we take the %else.)
%if "#{>=:#{version},3.2}"
set -ga terminal-features ",*:clipboard"
%else
set -ga terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\7'
%endif

# The modes {
setw -g clock-mode-colour colour135
setw -g mode-style "fg=colour196,bg=colour238,bold"

# }
# The panes {

set -g pane-border-style "bg=colour235,fg=colour238"
set -g pane-active-border-style "bg=colour236,fg=colour51"

# }
# The statusbar {

set -g status-position bottom
set -g status-style "bg=colour234,fg=colour137,nodim"
set -g status-left ''
set -g status-right '#{@notify}#[fg=colour233,bg=colour241,bold] #H '
#set -g status-right '#[fg=colour233,bg=colour241,bold] %d/%m #[fg=colour233,bg=colour245,bold] %H:%M:%S '
set -g status-right-length 50
set -g status-left-length 20

setw -g window-status-current-style "fg=brightcyan,bg=colour233,bold,nodim"
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '

setw -g window-status-style "fg=colour138,bg=colour233,nodim"
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '

setw -g window-status-bell-style "fg=colour255,bg=colour1,bold"

# }
# The messages {

set -g message-style "fg=colour232,bg=colour166,bold"

# }

# fzf window switcher
bind-key f run-shell -b "$NIXDIR/tmux/fzf-window.sh"

source $NIXDIR/tmux/dvorak.tmux.conf

# prefix m — fzf picker to move/swap the current window to another slot (overrides dvorak m=select-pane -D)
bind-key m run-shell -b "$NIXDIR/tmux/fzf-window-move.sh"

# prefix k — clear screen + drop tmux scrollback + outer terminal scrollback (after dvorak unbinds k)
bind k run-shell "printf '\\033[H\\033[2J\\033[3J' > #{pane_tty}" \; clear-history \; send-keys C-l

# Plugins (pinned to stable versions) — must be after dvorak to avoid key conflicts
set -g @plugin 'tmux-plugins/tpm#v3.1.0'
set -g @plugin 'tmux-plugins/tmux-resurrect#v4.0.0'
set -g @plugin 'tmux-plugins/tmux-continuum#v3.1.0'
set -g @plugin 'https://git.j4hangir.com/tmux/tmux-fingers'
set -g @fingers-key h
set -g @fingers-main-action "$NIXDIR/scripts/cb"

set -g @plugin 'https://git.j4hangir.com/tmux/tmux-jump'
set -g @jump-key-select 'i'

set -g @continuum-restore 'on'

# TPM must be last
run '~/.tmux/plugins/tpm/tpm'

