# Bootstrap NIXDIR so $NIXDIR works in source/run-shell lines below.
# set-environment -g exports to child shells; %hidden sets the parse-time
# variable so $NIXDIR expands correctly during this config file.
%if "#{==:#{NIXDIR},}"
set-environment -g NIXDIR /nix
%hidden NIXDIR=/nix
%endif

set -g default-terminal "tmux-256color"
set -g default-command /bin/zsh
set -g default-shell /bin/zsh

# Terminal title — [mosh I:N] when in mosh, plain otherwise
set -g set-titles on
set -g set-titles-string '#{?@mosh,[mosh: #I:#{session_windows}] - ,}#{@user}@#H'

# detect mosh + set @user at server start / config reload
run-shell 'tmux set -g @user "$(whoami)"; [ -n "$NIX_MOSH" ] && tmux set -g @mosh 1 || true'

# Let the shell control window names (dir on idle, command on exec)
set -g allow-rename on
set -g automatic-rename on

# Scroll History
set -g history-limit 30000

# Lower escape timing for quicker response to scroll-buffer access
set -s escape-time 0

# Set ability to capture on start and restore on exit window data
setw -g alternate-screen on

set -g set-clipboard on
set -ga terminal-features ",*:clipboard"

# Prefix
unbind C-b
set -g prefix C-u

# Vi mode everywhere
setw -g mode-keys vi
set -g status-keys vi

# Dvorak-friendly pane navigation: h/t/n/s = left/down/up/right
unbind-key j
bind-key h select-pane -L
bind-key t select-pane -D
unbind-key k
unbind-key l
bind-key s select-pane -R

# New splits/windows inherit current path
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vi copy mode
bind Escape copy-mode
bind P paste-buffer
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "cb"
bind-key -T copy-mode-vi 'r' send-keys -X rectangle-toggle

# Swap / and ? in copy-mode so / searches up (most-recent first), incremental find-as-you-type
bind-key -T copy-mode-vi / command-prompt -i -T search -p "(search up)" { send-keys -X search-backward-incremental -- "%%" }
bind-key -T copy-mode-vi ? command-prompt -i -T search -p "(search down)" { send-keys -X search-forward-incremental -- "%%" }

# prefix / → enter copy-mode and start incremental upward search
bind-key / copy-mode \; command-prompt -i -T search -p "(search up)" { send-keys -X search-backward-incremental -- "%%" }

# prefix v → enter copy-mode with visual selection already started
bind-key v copy-mode \; send-keys -X begin-selection

# Mouse
set-option -g mouse on
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @scroll-speed-num-lines-per-scroll 5
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

set -g update-environment -r
set-option -g status-interval 2
set-option -g display-time 4000

bind-key r source-file ~/.tmux.conf \; display-message "Configuration reloaded"

# Pipe the current pane to a log file with Shift-H - Press Shift-H again to stop.
bind-key H pipe-pane -o "cat >>$HOME/#W-tmux.log" \; display-message "Toggled logging to $HOME/#W-tmux.log"

# Cycle panes
bind-key ` select-pane -t :.+

# Ctrl+Alt+Left/Right to switch windows
bind -n C-M-Left previous-window
bind -n C-M-Right next-window

# Show url in buffer on osx
bind C-o run-shell "open $(tmux show-buffer)"

# Maximize and restore panes
unbind Up
bind Up neww -d -n tmp \; swap-pane -s tmp.1 \; select-window -t tmp
unbind Down
bind Down last-window \; swap-pane -s tmp.1 \; kill-window -t tmp

# Clipboard
bind C-v run "tmux set-buffer $(reattach-to-user-namespace pbpaste); tmux paste-buffer"
bind C-c run "tmux save-buffer - | cb"

# loud or quiet?
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none

# Theme
set -g pane-border-style "bg=colour235,fg=colour238"
set -g pane-active-border-style "bg=colour236,fg=colour51"

set -g status-position bottom
set -g status-style "bg=colour234,fg=colour137,dim"
set -g status-left ''
set -g status-right '#[fg=colour233,bg=colour241,bold] #H '
set -g status-right-length 50
set -g status-left-length 20

setw -g window-status-current-style "fg=colour81,bg=colour238,bold"
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '
setw -g window-status-style "fg=colour138,bg=colour235,none"
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '
setw -g window-status-bell-style "fg=colour255,bg=colour1,bold"

setw -g clock-mode-colour colour135
setw -g mode-style "fg=colour196,bg=colour238,bold"
set -g message-style "fg=colour232,bg=colour166,bold"

# fzf window switcher
bind-key f run-shell -b "$NIXDIR/tmux/fzf-window.sh"

# Plugins (pinned to stable versions)
set -g @plugin 'tmux-plugins/tpm#v3.1.0'
set -g @plugin 'tmux-plugins/tmux-resurrect#v4.0.0'
set -g @plugin 'tmux-plugins/tmux-continuum#v3.1.0'
set -g @plugin 'tmux-plugins/tmux-yank#v2.3.0'
set -g @yank_command 'cb'

set -g @plugin 'https://git.j4hangir.com/tmux/tmux-fingers'
set -g @fingers-key h
set -g @fingers-main-action 'cb'

set -g @continuum-restore 'on'

# TPM must be last
run '~/.tmux/plugins/tpm/tpm'
